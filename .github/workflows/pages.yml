# Deploys the app to GitHub Pages.
#
# The release gate from the brief (§2) applies here too — Pages IS shipping —
# so the offline suite runs before anything is uploaded. A build that cannot
# cold-boot with the radio off does not get deployed.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The digest is only as current as the last deploy, so the deploy runs daily
  # whether or not anyone pushed. 09:17 UTC rather than the hour: scheduled
  # jobs on the hour queue behind everyone else's.
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it: a half-replaced site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generates the content pack AND src/content/signing-key.generated.ts,
      # which is gitignored because it is a build product. pack.ts imports that
      # module, so typecheck cannot run before this step exists — which is why
      # every CI run until now failed at Typecheck on a clean checkout.
      - name: Build content pack
        run: npm run content:build

      # Sample digests. These are what the release gate below runs against,
      # and they are deliberately the only digests in the tree until the gate
      # has passed — see the ingest step near the end.
      - name: Build sample digests
        run: npm run content:samples

      - name: Validate content
        run: npm run content:validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # Built at the domain root, which is what the offline suite's preview
      # server serves. The deployable build is made after the gate passes.
      - name: Build
        run: npm run build

      - name: Performance budget
        run: npm run check:budget

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Offline suite
        run: npm run test:offline

      # Live digests, published over the samples — AFTER the gate, deliberately.
      #
      # This step used to run first, and that made the release gate depend on
      # the weather. The offline suite asserts on the digest it finds: that it
      # is marked `sample`, that the 06075 fixture's band reads Active, that a
      # 30-hour-old reading is reported as outside its freshness window. Live
      # data satisfies none of those on a quiet day and some of them on a loud
      # one, so the gate passed or failed according to whether California had a
      # flood warning. A gate that reports the weather is not a gate.
      #
      # So the order is: prove the client against bytes we control, then fetch
      # the real ones and ship those. Fail-soft per source — a source that is
      # down is recorded as a named gap, and if every source is down nothing is
      # overwritten and the samples ship. The step never fails the deploy: an
      # upstream outage should not stop a working app from being published.
      - name: Ingest live digest
        run: npm run content:ingest
        env:
          # Optional. AirNow is the one source that needs a key; without it the
          # source is not attempted, which the confidence line reflects in its
          # denominator rather than reporting as a gap.
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}

      # The gate verified the samples' signatures. These are different bytes,
      # signed after the gate ran, and they are what users actually fetch — so
      # they get verified too, by the same client verifier, before deploy.
      - name: Verify the signatures on what will ship
        run: npx vitest run tests/unit/snapshot-signature.test.ts

      # Pages serves a project site from /<repo>/, so the deployed build needs
      # that prefix baked in. Drop PUBLIC_BASE_PATH if a custom domain is ever
      # attached — the site is then at a domain root again.
      - name: Rebuild for the Pages subpath
        run: |
          export PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          echo "Building for base $PUBLIC_BASE_PATH"
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
